name: Update live market data

on:
  schedule:
    # Every 15 minutes Mon-Fri during market hours (IST)
    # IST is UTC+5:30, so 09:15 IST = 03:45 UTC, 15:30 IST = 10:00 UTC
    - cron: '0,15,30,45 3-9 * * 1-5'  # 03:45-10:00 UTC = 09:15-15:30 IST
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance feedparser

      - name: Fetch live data
        working-directory: nifty-research-platform
        run: python scripts/fetch_live.py

      - name: Check if data changed
        id: check_changes
        run: |
          if git diff --quiet nifty-research-platform/data/live.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nifty-research-platform/data/live.json
          git commit -m "chore: update live market data at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Log status
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✓ Data updated and committed"
          else
            echo "✓ No changes in data"
          fi
